name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: livraison
          POSTGRES_PASSWORD: livraison
          POSTGRES_DB: livraison_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U livraison" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgres://livraison:livraison@localhost:5432/livraison_test
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [packages/app_core, apps/client, apps/merchant, apps/courier]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: if [ -d test ] && [ -n "$(ls test)" ]; then flutter test; fi
