# Base de données locale pour le développement : PostgreSQL 16 + PostGIS
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: livraison
      POSTGRES_PASSWORD: livraison
      POSTGRES_DB: livraison
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/api/test/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  db-data:
